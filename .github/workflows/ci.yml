name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config dpkg-dev \
            libgtk-3-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxtst-dev libxfixes-dev libglib2.0-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Test Debian Packaging
        run: ./build-deb.sh

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: simplescreenshot-deb
          path: build-deb/*.deb
